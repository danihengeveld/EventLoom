services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: eventloom
      POSTGRES_USER: eventloom
      POSTGRES_PASSWORD: eventloom
    ports:
      - "5432:5432"
    volumes:
      - eventloom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventloom -d eventloom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventloom-postgres:
