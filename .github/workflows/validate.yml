name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore EventLoom.slnx --locked-mode
      - run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/EventLoom.UnitTests --configuration Release --no-build
      - run: dotnet pack EventLoom.slnx --configuration Release --no-build --output artifacts/packages

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs build