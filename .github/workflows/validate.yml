name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore EventLoom.slnx --locked-mode
      - run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/EventLoom.UnitTests --configuration Release --no-build
      - run: dotnet run --project tests/EventLoom.Analyzers.Tests --configuration Release --no-build
      - run: dotnet run --project tests/EventLoom.EntityFrameworkCore.UnitTests --configuration Release --no-build
      - run: dotnet run --project tests/EventLoom.EntityFrameworkCore.Sqlite.IntegrationTests --configuration Release --no-build

  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: docker version
      - run: dotnet restore EventLoom.slnx --locked-mode
      - run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/EventLoom.EntityFrameworkCore.PostgreSql.IntegrationTests --configuration Release --no-build

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore EventLoom.slnx --locked-mode
      - run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - name: Pack supported library packages
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --no-restore --output artifacts/packages
          done
      - name: Verify intended package set
        shell: bash
        run: |
          cat <<'EOF' | sort > expected-packages.txt
          EventLoom.0.1.0-alpha.0.nupkg
          EventLoom.Analyzers.0.1.0-alpha.0.nupkg
          EventLoom.EntityFrameworkCore.0.1.0-alpha.0.nupkg
          EventLoom.EntityFrameworkCore.PostgreSql.0.1.0-alpha.0.nupkg
          EventLoom.EntityFrameworkCore.Sqlite.0.1.0-alpha.0.nupkg
          EventLoom.AspNetCore.0.1.0-alpha.0.nupkg
          EventLoom.Hosting.0.1.0-alpha.0.nupkg
          EventLoom.Testing.0.1.0-alpha.0.nupkg
          EOF
          find artifacts/packages -maxdepth 1 -name '*.nupkg' -exec basename {} \; | sort > actual-packages.txt
          diff --unified expected-packages.txt actual-packages.txt
      - name: Verify package README files
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            unzip -Z1 "$package" | grep --fixed-strings --line-regexp 'README.md' > /dev/null
          done
      - name: Verify package icon files
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            unzip -Z1 "$package" | grep --fixed-strings --line-regexp 'eventloom-icon.png' > /dev/null
            unzip -p "$package" '*.nuspec' | grep --fixed-strings '<icon>eventloom-icon.png</icon>' > /dev/null
          done
      - name: Restore package consumer
        run: dotnet restore tests/EventLoom.PackageConsumerTests --configfile tests/EventLoom.PackageConsumerTests/NuGet.Config -p:RestorePackagesWithLockFile=false
      - name: Run package consumer
        run: dotnet run --project tests/EventLoom.PackageConsumerTests --configuration Release --no-restore
      - name: Verify API template
        shell: bash
        run: |
          dotnet new install ./templates/eventloom-api
          dotnet new eventloom-api --output "$RUNNER_TEMP/generated-eventloom-api"
          dotnet restore "$RUNNER_TEMP/generated-eventloom-api" --configfile tests/EventLoom.PackageConsumerTests/NuGet.Config -p:RestorePackagesWithLockFile=false
          dotnet build "$RUNNER_TEMP/generated-eventloom-api" --no-restore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs build