name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EventLoom.slnx --locked-mode
      - name: Build
        run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - name: Run core tests
        run: dotnet run --project tests/EventLoom.UnitTests --configuration Release --no-build
      - name: Run analyzer tests
        run: dotnet run --project tests/EventLoom.Analyzers.Tests --configuration Release --no-build
      - name: Run EF Core and hosting tests
        run: dotnet run --project tests/EventLoom.EntityFrameworkCore.UnitTests --configuration Release --no-build
      - name: Run SQLite integration tests
        run: dotnet run --project tests/EventLoom.EntityFrameworkCore.Sqlite.IntegrationTests --configuration Release --no-build

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify Docker
        run: docker version
      - name: Restore
        run: dotnet restore EventLoom.slnx --locked-mode
      - name: Build
        run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - name: Run PostgreSQL integration tests
        run: dotnet run --project tests/EventLoom.EntityFrameworkCore.PostgreSql.IntegrationTests --configuration Release --no-build

  packages:
    name: Packages and template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EventLoom.slnx --locked-mode
      - name: Build
        run: dotnet build EventLoom.slnx --configuration Release --no-restore
      - name: Pack
        shell: bash
        run: ./scripts/pack.sh 0.1.0-alpha.0
      - name: Verify package contents
        shell: bash
        run: ./scripts/verify-packages.sh 0.1.0-alpha.0
      - name: Validate package consumer and template
        shell: bash
        run: ./scripts/validate-packages.sh 0.1.0-alpha.0

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Build documentation
        run: pnpm --dir docs build
